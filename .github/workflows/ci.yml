name: CI

# Job ids below (lint-and-typecheck, test, build, security-audit) are referenced
# verbatim in docs/github-governance.md as required branch-protection status
# checks. If you rename a job here, update that doc in the same commit.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run test:coverage

  build:
    name: build
    needs: [lint-and-typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  # Advisory only: continue-on-error means this job never blocks a merge.
  # Under this repo's "Standard" governance tier (see docs/github-governance.md)
  # it is intentionally NOT added to the required status checks list, so a
  # known-vulnerable dependency surfaces in the PR checks UI without gating
  # merges. Moving to a stricter tier would (a) make this job required and/or
  # (b) add a CodeQL analysis workflow alongside it.
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
