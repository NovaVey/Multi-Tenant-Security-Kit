# Requires a repository secret named NPM_TOKEN — an npm "Automation" access
# token with publish rights to the @novavey scope — configured manually under
# Settings -> Secrets and variables -> Actions before the first tagged release
# is pushed. See docs/github-governance.md, step 3. Without it, the
# "npm publish" step below will fail authentication.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # to create the GitHub Release
  id-token: write # required for npm provenance

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so generated release notes can see merged PRs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      # Full gate: format, lint, typecheck, test, and build must all pass
      # before anything is ever published.
      - run: npm run verify

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
