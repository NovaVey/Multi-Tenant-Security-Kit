# Release automation via Changesets — see CONTRIBUTING.md's "How a release
# happens" and .changeset/README.md for the full flow. Runs on every push
# to main and, via changesets/action, either:
#   (a) opens/updates a "Version Packages" PR when there are pending
#       .changeset/*.md files, or
#   (b) publishes to npm once that PR has been merged (no pending
#       changesets left, and package.json's version no longer matches
#       what's published on npm) — after which this workflow itself
#       (not changesets/action — see the "Check whether this run actually
#       published" step below for why) creates the matching git tag and
#       GitHub Release.
#
# This replaces the previous tag-push-triggered release, which required a
# maintainer to manually bump package.json AND push a git tag by hand for
# every release. Changesets does both automatically; a maintainer's only
# remaining job is reviewing/merging the Version Packages PR (and writing
# its CHANGELOG.md entry — see .changeset/README.md, changelog generation
# is deliberately off here).
#
# Requires a repository secret named NPM_TOKEN — an npm "Automation" access
# token with publish rights to the @novavey scope — see
# docs/github-governance.md, step 3.
#
# Requires the repo setting "Allow GitHub Actions to create and approve
# pull requests" (Settings -> Actions -> General -> Workflow permissions) —
# without it, changesets/action can't open the Version Packages PR. See
# docs/github-governance.md, step 4 (same setting Dependabot auto-merge
# needs).

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # to push the Version Packages branch/commit and git tags
  pull-requests: write # to open/update the Version Packages PR
  id-token: write # required for npm provenance

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — changesets needs it to diff against the last release

      # Node 22, not 20: @changesets/cli@3 requires Node ^22.11 (its bin.js
      # calls node:module's enableCompileCache() unconditionally, which
      # doesn't exist on Node 20 — crashed the first real run of this
      # workflow with "TypeError: enableCompileCache is not a function"
      # before a single changeset command could run). Same class of miss as
      # test-integration's Node 20 -> 22 fix — my own sandbox runs Node 22
      # and never surfaced this locally.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      # Full gate: format, lint, typecheck, test, build, verify:dist,
      # verify:docs must all pass before a Version Packages PR is ever
      # opened against a broken main, or anything is ever published.
      - run: npm run verify

      - name: Version packages / publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both needed, for different consumers: NODE_AUTH_TOKEN is what
          # actually authenticates `npm publish` (via the .npmrc
          # actions/setup-node's registry-url wires up). NPM_TOKEN is
          # checked separately by changesets/action itself — without it,
          # the first real run of this workflow logged "No NPM_TOKEN found,
          # but OIDC is available - using npm trusted publishing" and tried
          # an OIDC-based flow this npm package was never configured for,
          # instead of the token auth that's actually set up and working.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # steps.changesets.outputs.published is NOT trustworthy: changesets/
      # action detects a successful publish by regex-matching a literal
      # "New tag:" line in `npx changeset publish`'s stdout. The 0.2.0
      # release proved this wrong — @changesets/cli@3.0.0's actual output
      # (its newer spinner-based UI) prints "Created git tags." with no
      # per-package "New tag: <name>" line at all, so `published` came back
      # 'false' even though `npm publish` genuinely succeeded (confirmed on
      # the registry). That silently skipped both the git tag push AND the
      # GitHub Release below — no failed check, just a quietly incomplete
      # release that needed manual recovery. Verify against the npm
      # registry directly instead of trusting that string match.
      - name: Check whether this run actually published a new version
        id: check-publish
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged — nothing new to release."
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is on npm and v$VERSION isn't tagged yet — this run published it."
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing published this run (no pending changesets, or the Version Packages PR just opened/updated)."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Creates the vX.Y.Z tag AND the GitHub Release together — GitHub's
      # release-creation API auto-creates a tag_name that doesn't exist yet,
      # pointing at this commit (the default target_commitish is the repo's
      # default branch, i.e. main, which is exactly where we are). This
      # replaces relying on changesets/action's own tag creation entirely,
      # not just papering over the detection above — createGithubReleases:
      # false on the changesets/action step already stops it from also
      # trying (CHANGELOG.md stays the authoritative record; this is a
      # convenience view of it via linked PRs).
      - name: Create git tag + GitHub Release
        if: steps.check-publish.outputs.published == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.check-publish.outputs.version }}
          generate_release_notes: true
