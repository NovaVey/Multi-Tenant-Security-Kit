version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    assignees:
      - 'NovaVey'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Batch low-risk devDependency bumps together to reduce PR noise. Major
      # bumps and all production-dependency bumps are left ungrouped so each
      # gets its own PR and individual review.
      dev-dependencies-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    assignees:
      - 'NovaVey'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      # github/codeql-action ships as several separately-versioned sub-actions
      # (init, analyze, upload-sarif, ...) used together in the same job —
      # CodeQL's own tooling requires init/analyze to run at matching major
      # versions. Left ungrouped, Dependabot opens one PR per sub-action,
      # each individually landing a mismatched pair and failing CI (see
      # PRs #44/#48). Grouping keeps every codeql-action bump in one PR.
      codeql-action:
        patterns:
          - 'github/codeql-action/*'
